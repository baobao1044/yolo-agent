<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="YOLO Agent — autonomous AI agent in Go with budget-aware Code-RAG">
  <title>YOLO Agent</title>

  <defs>
    <!-- Background gradient: deep navy -> near-black -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B33"/>
      <stop offset="55%" stop-color="#070E1C"/>
      <stop offset="100%" stop-color="#03060E"/>
    </linearGradient>

    <!-- Radial glow behind the graph -->
    <radialGradient id="glow" cx="72%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1B6FB0" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#03060E" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent gradient for edges + core nodes -->
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E3A5F" opacity="0.35"/>
    </pattern>

    <!-- Soft glow filter for nodes -->
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- Thin top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#cyan)" opacity="0.55"/>

  <!-- ============================================================= -->
  <!-- Code structure graph (right side)                              -->
  <!-- Nodes at graduated SACRS levels: core (raw, large+bright) ->   -->
  <!-- peripheral stubs (small, dim). Edges = call/import relations. -->
  <!-- ============================================================= -->
  <g id="graph" stroke-linecap="round">

    <!-- Edges (drawn first, behind nodes) -->
    <g stroke="url(#cyan)" fill="none" opacity="0.55">
      <line x1="720" y1="120" x2="855" y2="78"  stroke-width="1.6"/>
      <line x1="720" y1="120" x2="858" y2="175" stroke-width="1.6"/>
      <line x1="720" y1="120" x2="848" y2="248" stroke-width="1.4"/>
      <line x1="855" y1="78"  x2="990" y2="48"  stroke-width="1.2"/>
      <line x1="858" y1="175" x2="990" y2="48"  stroke-width="1.2"/>
      <line x1="858" y1="175" x2="998" y2="135" stroke-width="1.2"/>
      <line x1="848" y1="248" x2="998" y2="135" stroke-width="1.2"/>
      <line x1="848" y1="248" x2="985" y2="232" stroke-width="1.2"/>
      <line x1="990" y1="48"  x2="1098" y2="92" stroke-width="1"/>
      <line x1="998" y1="135" x2="1098" y2="92" stroke-width="1"/>
      <line x1="998" y1="135" x2="1102" y2="188" stroke-width="1"/>
      <line x1="985" y1="232" x2="1102" y2="188" stroke-width="1"/>
    </g>

    <!-- Core node (seed, pinned at raw) — largest, brightest -->
    <circle cx="720" cy="120" r="34" fill="#22D3EE" opacity="0.22" filter="url(#soft)"/>
    <circle cx="720" cy="120" r="17" fill="url(#cyan)" stroke="#67E8F9" stroke-width="1.5"/>
    <circle cx="720" cy="120" r="6.5" fill="#ECFEFF"/>

    <!-- k=1 sig+docs nodes -->
    <circle cx="855" cy="78" r="11" fill="url(#cyan)" opacity="0.92" stroke="#67E8F9" stroke-width="1"/>
    <circle cx="858" cy="175" r="11" fill="url(#violet)" opacity="0.92" stroke="#C4B5FD" stroke-width="1"/>

    <!-- k=2 interface node -->
    <circle cx="848" cy="248" r="8.5" fill="#A855F7" opacity="0.8" stroke="#C4B5FD" stroke-width="0.9"/>

    <!-- k=1 / k=2 mid layer -->
    <circle cx="990" cy="48"  r="9" fill="#22D3EE" opacity="0.78" stroke="#67E8F9" stroke-width="0.9"/>
    <circle cx="998" cy="135" r="9.5" fill="url(#violet)" opacity="0.74" stroke="#C4B5FD" stroke-width="0.9"/>
    <circle cx="985" cy="232" r="7.5" fill="#7C3AED" opacity="0.68" stroke="#A78BFA" stroke-width="0.8"/>

    <!-- k=3 stub nodes — smallest, dimmest -->
    <circle cx="1098" cy="92"  r="5.5" fill="#38BDF8" opacity="0.6"/>
    <circle cx="1102" cy="188" r="5"   fill="#8B5CF6" opacity="0.55"/>
    <circle cx="1118" cy="118" r="4"   fill="#38BDF8" opacity="0.45"/>
    <circle cx="1112" cy="248" r="4.5" fill="#7C3AED" opacity="0.45"/>

    <!-- Budget arc framing the selected subgraph -->
    <path d="M 678 70 A 250 250 0 0 1 1138 268" fill="none" stroke="url(#cyan)" stroke-width="1.4" stroke-dasharray="2 7" opacity="0.5"/>
  </g>

  <!-- ============================================================= -->
  <!-- Wordmark + tagline (left side)                                 -->
  <!-- ============================================================= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
    <!-- Brand mark: small glowing gopher-dot cluster accent -->
    <g transform="translate(74, 78)">
      <circle cx="0"  cy="0"  r="11" fill="#22D3EE" opacity="0.22" filter="url(#soft)"/>
      <circle cx="0"  cy="0"  r="6"  fill="url(#cyan)"/>
      <circle cx="15" cy="-6" r="4"  fill="#A855F7" opacity="0.85"/>
      <circle cx="15" cy="8"  r="3"  fill="#22D3EE" opacity="0.7"/>
      <line x1="0" y1="0" x2="15" y2="-6" stroke="#67E8F9" stroke-width="1" opacity="0.7"/>
      <line x1="0" y1="0" x2="15" y2="8"  stroke="#67E8F9" stroke-width="1" opacity="0.6"/>
    </g>

    <text x="104" y="92" font-size="44" font-weight="700" fill="url(#word)" letter-spacing="0.5">YOLO Agent</text>

    <text x="74" y="124" font-size="15.5" fill="#94A3B8" font-weight="500" letter-spacing="0.3">
      One binary. One agent. Full autonomy.
    </text>

    <!-- Feature chips -->
    <g font-size="13" font-weight="600" letter-spacing="0.4">
      <g transform="translate(74, 158)">
        <rect x="0" y="0" width="116" height="28" rx="14" fill="#0EA5E9" opacity="0.14" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1"/>
        <text x="58" y="18.5" text-anchor="middle" fill="#7DD3FC">Code-RAG</text>
      </g>
      <g transform="translate(198, 158)">
        <rect x="0" y="0" width="150" height="28" rx="14" fill="#7C3AED" opacity="0.14" stroke="#A855F7" stroke-opacity="0.45" stroke-width="1"/>
        <text x="75" y="18.5" text-anchor="middle" fill="#C4B5FD">Multi-agent workflows</text>
      </g>
      <g transform="translate(356, 158)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#0EA5E9" opacity="0.12" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1"/>
        <text x="60" y="18.5" text-anchor="middle" fill="#7DD3FC">Browser + MCP</text>
      </g>
      <g transform="translate(484, 158)">
        <rect x="0" y="0" width="124" height="28" rx="14" fill="#7C3AED" opacity="0.12" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1"/>
        <text x="62" y="18.5" text-anchor="middle" fill="#C4B5FD">Long-term memory</text>
      </g>
    </g>

    <!-- Terminal prompt line -->
    <g transform="translate(74, 224)" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13.5">
      <text x="0" y="0" fill="#22D3EE" font-weight="700">$</text>
      <text x="16" y="0" fill="#CBD5E1">yolo-agent</text>
      <text x="98" y="0" fill="#64748B">--one-shot</text>
      <text x="186" y="0" fill="#E2E8F0">"index this repo &amp; explain the auth flow"</text>
      <circle cx="476" cy="-4" r="3" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Built-with note -->
    <text x="74" y="262" font-size="12.5" fill="#475569" font-weight="500">
      Built in Go · Single binary · Budget-aware MCKP context assembly
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="318" width="1200" height="2" fill="url(#violet)" opacity="0.4"/>
</svg>
