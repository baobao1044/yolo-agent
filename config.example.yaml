llm:
  base_url: "https://openrouter.ai/api/v1"
  api_key: ""
  model: "anthropic/claude-3.5-sonnet"
  max_tokens: 4096
  temperature: 0.7

agent:
  max_iterations: 50
  data_dir: ""

memory:
  driver: "sqlite"
  database: ""
  fts_enabled: true

tools:
  terminal_enabled: true
  browser_enabled: true
  computer_enabled: false
  terminal_allow_list: []
  terminal_deny_list: []

workflow:
  enabled: true
  max_concurrent: 16
  max_total: 1000
  verify_retries: 2

approval:
  auto_approve_low_risk: true
  require_approval_for:
    - terminal
    - computer
    - mcp_
  deny_patterns:
    - '(?i)rm\\s+-rf\\s*/'
    - '(?i)mkfs'
    - '(?i)dd\\s+if=.*of=/dev/'
    - '(?i)format\\s*[C-Z]:'
    - '(?i)reg\\s+delete\\s+HKLM'

# CORE Code-RAG engine: index a repository and retrieve budget-aware context.
# Disabled by default to avoid the ONNX/dependency setup cost; enable when you
# want repo-level code reasoning.
corerag:
  enabled: false
  budget: 4096        # token budget B for assembled context
  depth: 2            # BFS expansion depth k
  embedding:
    provider: onnx              # onnx (default, local) | api | ollama | mock
    fallback: api              # used if the primary provider fails to init
    model: "bge-small-en-v1.5"
    dim: 384
    model_path: ""             # path to the .onnx file (for onnx); vocab.txt beside it
    lib_path: ""               # onnxruntime shared lib; empty = env YOLO_ONNX_LIB
    ollama_url: "http://localhost:11434"
    ollama_model: ""
  relevance:
    alpha: 0.4    # semantic similarity weight
    beta: 0.2     # edge weight
    gamma: 0.2    # centrality (out-degree) weight
    delta: 0.2    # utility penalty (in-degree) weight
    theta: 0.15   # S(v) >= theta required to expand a node
  # priors: optional override of compression prior R(k,Type) from CORE doc
  # Table 1. Omit to use the built-in defaults.

mcp_servers:
  - name: fetch
    command: python
    args:
      - -m
      - mcp_server_fetch

# HTTP REST gateway
gateway:
  enabled: false
  port: 8080

# Messaging gateways
telegram:
  enabled: false
  token: ""

discord:
  enabled: false
  token: ""

slack:
  enabled: false
  token: ""

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""

ui:
  theme: "dark"
